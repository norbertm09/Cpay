plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'global.cpay.app'
    // API 36 : exigence Google Play (targetSdk >= 35 depuis aout 2025, 36 depuis aout 2026) — audit 2026-11-02 P0
    compileSdk 36

    defaultConfig {
        applicationId "global.cpay.app"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "2.7.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "API_BASE_URL", '"https://api.c-pay.global/api/v1"'
        buildConfigField "String", "PAY_BASE_URL",  '"https://pay.c-pay.global"'
    }

    buildTypes {
        debug {
            // Build de developpement : serveur de dev (base dediee, operateurs sandbox). Jamais la production.
            buildConfigField "String", "API_BASE_URL", '"https://api.dev.c-pay.global/api/v1"'
            buildConfigField "String", "PAY_BASE_URL",  '"https://pay.dev.c-pay.global"'
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", '"https://api.c-pay.global/api/v1"'
        }
        // Lot 4 (audit 2026-11-02 mobile P2-2) : build de recette terrain — serveur de dev, R8 comme la release,
        // aucun journal HTTP (le debug journalise les en-tetes), installable a cote de la release (.staging).
        staging {
            initWith release
            matchingFallbacks = ['release']
            signingConfig signingConfigs.debug
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            buildConfigField "String", "API_BASE_URL", '"https://api.dev.c-pay.global/api/v1"'
            buildConfigField "String", "PAY_BASE_URL",  '"https://pay.dev.c-pay.global"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        viewBinding true
        buildConfig true
        dataBinding false
    }

    // Les APK par ABI sont incompatibles avec la generation de l'AAB sous AGP 8.11 (buildReleasePreBundle :
    // « Please disable building multiple APKs when building an Android app bundle »). L'AAB decoupe lui-meme
    // par ABI sur Google Play ; un seul APK universel suffit pour l'installation directe (release 2.7.1).
    splits {
        abi {
            enable false
        }
    }

    // Lot Android P2 : tests unitaires JVM (android.util.Log, Base64… retournent des valeurs neutres)
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Core
    // Lot Android P2 (2026-11-10) : dernieres versions compatibles compileSdk 36 / AGP 8.11.1. Les versions suivantes
    // (core 1.18+, navigation 2.10+, okhttp 5.x « android ») exigent compileSdk 37 : lot « AGP 9 / API 37 » dedie.
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.5'

    // Network — Retrofit 3 livre ses regles R8 consommateur (proguard-rules.pro allege, audit P2-3)
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // QR Code (generation du lien carte uniquement — lot 4 : scanner ML Kit/CameraX retires avec le profil porteur)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Biometrics
    implementation 'androidx.biometric:biometric:1.1.0'

    // Security
    implementation 'androidx.security:security-crypto:1.1.0'

    // Room (base de données locale)
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    // Test — unitaires JVM (:app:testDebugUnitTest en CI, audit P2-4)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.13.1'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
