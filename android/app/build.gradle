plugins {
    id 'com.android.application'
    // Kotlin integre a AGP 9 : plus de plugin org.jetbrains.kotlin.android (docs/MOBILE-STORES.md § 1.7)
    id 'com.google.devtools.ksp'
}

android {
    namespace 'global.cpay.app'
    // Palier AGP 9 / API 37 (2026-11-11) : compilation contre l'API 37 (exigee par androidx.core 1.19, navigation 2.10,
    // lifecycle 2.11, okhttp 5). targetSdk reste 36 (exigence Google Play depuis aout 2026) : le passage du
    // comportement d'execution a l'API 37 se fera apres recette sur appareil (lot suivant), pas en meme temps que
    // la montee d'outillage.
    compileSdk 37

    defaultConfig {
        applicationId "global.cpay.app"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "2.7.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "API_BASE_URL", '"https://api.c-pay.global/api/v1"'
        buildConfigField "String", "PAY_BASE_URL",  '"https://pay.c-pay.global"'
    }

    buildTypes {
        debug {
            // Build de developpement : serveur de dev (base dediee, operateurs sandbox). Jamais la production.
            buildConfigField "String", "API_BASE_URL", '"https://api.dev.c-pay.global/api/v1"'
            buildConfigField "String", "PAY_BASE_URL",  '"https://pay.dev.c-pay.global"'
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_BASE_URL", '"https://api.c-pay.global/api/v1"'
        }
        // Lot 4 (audit 2026-11-02 mobile P2-2) : build de recette terrain — serveur de dev, R8 comme la release,
        // aucun journal HTTP (le debug journalise les en-tetes), installable a cote de la release (.staging).
        staging {
            initWith release
            matchingFallbacks = ['release']
            signingConfig signingConfigs.debug
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            buildConfigField "String", "API_BASE_URL", '"https://api.dev.c-pay.global/api/v1"'
            buildConfigField "String", "PAY_BASE_URL",  '"https://pay.dev.c-pay.global"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // Kotlin integre : jvmTarget suit compileOptions.targetCompatibility (17) ; plus de bloc kotlinOptions{}

    buildFeatures {
        viewBinding = true
        buildConfig = true
        dataBinding = false
    }

    // Les APK par ABI sont incompatibles avec la generation de l'AAB sous AGP 8.11 (buildReleasePreBundle :
    // « Please disable building multiple APKs when building an Android app bundle »). L'AAB decoupe lui-meme
    // par ABI sur Google Play ; un seul APK universel suffit pour l'installation directe (release 2.7.1).
    splits {
        abi {
            enable false
        }
    }

    // Lot Android P2 : tests unitaires JVM (android.util.Log, Base64… retournent des valeurs neutres)
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Core — palier AGP 9 / API 37 (2026-11-11) : versions stables de septembre 2026 (compileSdk 37).
    // core-ktx est un artefact vide depuis 1.19 (API fusionnees dans core) : on depend de core directement.
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.10.2'
    implementation 'androidx.navigation:navigation-ui-ktx:2.10.2'

    // Network — Retrofit 3 livre ses regles R8 consommateur (proguard-rules.pro allege, audit P2-3) ; OkHttp 5
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.5.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    // QR Code (generation du lien carte uniquement — lot 4 : scanner ML Kit/CameraX retires avec le profil porteur)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Biometrics
    implementation 'androidx.biometric:biometric:1.1.0'

    // Security — lot depreciations (2026-11-12) : la session est chiffree par SecureStore (Keystore direct) ;
    // security-crypto (API depreciees en 1.1.0) ne sert plus qu'a lire l'ancien fichier pour la migration. A retirer
    // avec le fichier cplus_session une fois les installations migrees (deux releases).
    implementation 'androidx.security:security-crypto:1.1.0'

    // Room (base de données locale)
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    // Test — unitaires JVM (:app:testDebugUnitTest en CI, audit P2-4)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.15.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
