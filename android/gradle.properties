android.useAndroidX=true
# Palier AGP 9 / API 37 (2026-11-11) : Jetifier retire (aucune dependance support historique ; obsolete sous AGP 9).
# Kotlin integre et nouveau DSL sont les valeurs par defaut d'AGP 9 (android.builtInKotlin / android.newDsl = true) :
# rien a poser ici. Les drapeaux R8 d'AGP 9 (strictFullModeForKeepRules, optimizedResourceShrinking) sont acceptes :
# proguard-rules.pro garde explicitement <init>(...) sur les modeles Gson.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
