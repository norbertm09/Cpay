plugins {
    id 'com.android.application' version '8.11.1' apply false
    id 'com.android.library' version '8.11.1' apply false
    // Lot Android P2 (2026-11-10) : Kotlin 2.2.21 + KSP 2.2.21-2.0.4 = derniere paire supportee par AGP 8.11.1.
    // KSP 2.3+ exige AGP >= 8.12 ; androidx.core 1.18+, navigation 2.10, okhttp-android 5.5 exigent compileSdk 37
    // (AGP 9 / Gradle 9) : passage prevu dans un lot « AGP 9 / API 37 » dedie, cf. docs/MOBILE-STORES.md § 1.7.
    id 'org.jetbrains.kotlin.android' version '2.2.21' apply false
    // KSP remplace kapt (kapt echoue sous Kotlin 2.x avec Room ; KSP est le processeur recommande par Room)
    id 'com.google.devtools.ksp' version '2.2.21-2.0.4' apply false
}
