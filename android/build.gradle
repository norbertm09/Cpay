plugins {
    // Palier « AGP 9 / API 37 » (2026-11-11) : AGP 9.5.1 (Gradle >= 9.6, JDK 17, API max 37). Kotlin est integre a AGP
    // (built-in Kotlin, KGP fourni par AGP) : le plugin org.jetbrains.kotlin.android n'est plus applique et le DSL
    // kotlinOptions{} disparait (jvmTarget = compileOptions.targetCompatibility). Nouveau DSL (android.newDsl) :
    // les anciens types ApplicationExtensionImpl / variant API ne sont plus exposes.
    id 'com.android.application' version '9.5.1' apply false
    id 'com.android.library' version '9.5.1' apply false
    // KSP 2.3.x (decorrele de la version de Kotlin, AGP >= 8.12) ; 2.3.13 porte une regression (executions concurrentes,
    // google/ksp#3286) : on reste en 2.3.12. Room 2.8.5 est le processeur.
    id 'com.google.devtools.ksp' version '2.3.12' apply false
}
