# CI C-Pay — voir docs/CI-CD.md
# Declenchee sur chaque pull request et sur les push vers main, develop et wave-*.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop, 'wave-*']

# Un run par branche/PR : un nouveau push annule le precedent
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitoring:
    name: Alertes de rapprochement (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Preparer Alertmanager officiel (SHA256)
        run: node scripts/fetch-alertmanager.cjs
      - name: Tester la configuration et la livraison SMTP locale
        run: node --test monitoring/alertmanager/config.test.cjs monitoring/tests/alert-delivery.test.cjs
      - name: Valider les regles Prometheus
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/monitoring/prometheus:/rules:ro" -w /rules
          prom/prometheus:v3.5.0 check rules alerts.yml
      - name: Tester les scenarios des alertes
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/monitoring/prometheus:/rules:ro" -w /rules
          prom/prometheus:v3.5.0 test rules reconciliation.test.yml ops.test.yml

  # ────────────────────────────────────────────────────────────────
  backend:
    name: Backend (syntaxe, jest, audit, migrations PostgreSQL)
    runs-on: ubuntu-latest
    # Lot 7 (audit P2-11) : les migrations sont aussi rejouees sur un vrai PostgreSQL 16 (meme version majeure que la
    # base managee OVH), pas seulement sur PGlite — verrous, extensions et transaction unique de migrate.js compris.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cplus_ci
          POSTGRES_DB: cplus_ci
          POSTGRES_HOST_AUTH_METHOD: trust   # base jetable du runner : aucun mot de passe a stocker dans le workflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cplus_ci -d cplus_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: node --check src/**/*.js
        run: sh ../scripts/check-js-syntax.sh src
      - name: Tests (jest)
        run: npm test
        env:
          CI: 'true'
          NODE_ENV: test
      - name: Migrations sur PostgreSQL 16 (base vierge, puis rejeu idempotent)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: cplus_ci
          DB_USER: cplus_ci
          LOG_LEVEL: warn
        run: |
          export DB_PASSWORD="$(openssl rand -hex 12)"   # ignore par le service (trust) ; valeur requise par le client pg
          node src/config/migrate.js
          node src/config/migrate.js   # deja appliquees : aucune erreur de checksum
          expected=$(ls database/ | grep -cE '^[0-9]+_.*\.sql$')
          applied=$(psql -h 127.0.0.1 -U cplus_ci -d cplus_ci -tAc 'SELECT count(*) FROM schema_migrations')
          echo "migrations : $applied appliquees / $expected fichiers"
          [ "$applied" = "$expected" ] || { echo "::error::schema_migrations ($applied) != fichiers SQL ($expected)"; exit 1; }
          # la fonction de frais (migration 010) et le wrapper de compatibilite calc_fee (migration 013) existent
          psql -h 127.0.0.1 -U cplus_ci -d cplus_ci -tAc "SELECT count(*) FROM pg_proc WHERE proname IN ('cpay_calculate_fee','calc_fee')" | grep -qx 2
      - name: npm audit (dependances de production, niveau high) — bloquant
        run: npm audit --omit=dev --audit-level=high

  # ────────────────────────────────────────────────────────────────
  portals:
    name: Portail ${{ matrix.portal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        portal: [admin, merchant, cardholder, partners, bank, agency, agent]
    defaults:
      run:
        working-directory: portal/${{ matrix.portal }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # meme Node que docker/Dockerfile.portal (lot 7 : Node 22, Node 20 en fin de vie depuis avril 2026)
          node-version: 22
          cache: npm
          cache-dependency-path: portal/${{ matrix.portal }}/package-lock.json
      - name: Dependances verrouillees (tous les portails ont un package-lock.json)
        run: npm ci --no-audit --no-fund
      - name: Tests des portails merchant, admin et cardholder (vitest)
        if: matrix.portal == 'merchant' || matrix.portal == 'admin' || matrix.portal == 'cardholder'
        run: npm test
        env:
          CI: 'true'
      - name: Build (vite build -> build/)
        run: npm run build
        env:
          REACT_APP_API_BASE_URL: https://api.c-pay.global
      - uses: actions/upload-artifact@v7
        with:
          name: portal-${{ matrix.portal }}
          path: portal/${{ matrix.portal }}/build
          retention-days: 7
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  browser-recipes:
    name: Recette navigateur isolee (app, merchant, admin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            portal/cardholder/package-lock.json
            portal/merchant/package-lock.json
            portal/admin/package-lock.json
      - name: Installer les dependances verrouillees
        run: |
          for portal in cardholder merchant admin; do npm ci --prefix "portal/$portal" --no-audit --no-fund; done
          npm ci --prefix e2e --no-audit --no-fund
      - name: Installer Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Construire les trois interfaces du commit avec API locale (vite build)
        run: |
          for portal in cardholder merchant admin; do npm run build --prefix "portal/$portal"; done
        env:
          REACT_APP_API_BASE_URL: ''
      - name: Tester les parcours et le blocage reseau
        run: npm test --prefix e2e

  landing:
    name: Vitrine (HTML, liens, JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python3 -I scripts/check-landing.py portal/landing

  # ────────────────────────────────────────────────────────────────
  php:
    name: PHP ${{ matrix.php }} (php -l)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']   # 7.4 = minimum annonce par le plugin WooCommerce
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: php -l sur sdk/php et plugins/
        run: |
          find sdk/php plugins -type f -name '*.php' -not -path '*/vendor/*' -print0 \
            | xargs -0 -n1 php -l

  # ────────────────────────────────────────────────────────────────
  sdk-js:
    name: SDK JavaScript (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sh scripts/check-js-syntax.sh sdk/javascript
      - run: node -e "const p=require('./sdk/javascript/package.json'); console.log('@c-pay/sdk', p.version)"

  expo:
    name: App Expo (transformation Babel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/cpay-mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/cpay-mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Babel (babel-preset-expo) sur App.js
        run: |
          node -e "
            const babel = require('@babel/core');
            const out = babel.transformFileSync('App.js', { presets: ['babel-preset-expo'], filename: 'App.js', babelrc: false, configFile: false });
            console.log('App.js : ' + out.code.length + ' octets transformes');
          "

  # ────────────────────────────────────────────────────────────────
  android:
    name: Android (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: SDK du runner (android/local.properties pointe sur /opt/android-sdk du poste de dev)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: gradlew :app:testDebugUnitTest (lot Android P2 — tests unitaires JVM)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-test.log" || {
            grep -A25 "What went wrong" "$RUNNER_TEMP/gradle-test.log" | grep -v "^\s*$" | head -40 | sed 's/^/::error::/'
            grep -E "^e: |FAILED|Could not (resolve|find|determine)|Unsupported|incompatible" "$RUNNER_TEMP/gradle-test.log" | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest
          retention-days: 7
          if-no-files-found: ignore
      - name: gradlew :app:assembleDebug
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            # Erreurs Kotlin/Gradle remontées en annotations (les logs bruts ne sont pas toujours accessibles)
            # Les 25 lignes qui suivent « What went wrong » portent la cause reelle (plugin, dependance, Kotlin)
            grep -A25 "What went wrong" "$RUNNER_TEMP/gradle.log" | grep -v "^\s*$" | head -40 | sed 's/^/::error::/'
            grep -E "^e: |Could not (resolve|find|determine)|Unsupported|requires|incompatible" "$RUNNER_TEMP/gradle.log" | head -20 | sed 's/^/::error::/'
            exit 1
          }
      - name: gradlew :app:assembleRelease :app:bundleRelease :app:assembleStaging (release non signee — eprouve R8 et l'AAB ; staging = recette)
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:bundleRelease :app:assembleStaging --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-release.log" || {
            grep -A25 "What went wrong" "$RUNNER_TEMP/gradle-release.log" | grep -v "^\s*$" | head -40 | sed 's/^/::error::/'
            grep -E "^e: |Missing class|ERROR: R8|Could not (resolve|find|determine)|Unsupported|incompatible|missing_rules" "$RUNNER_TEMP/gradle-release.log" | head -40 | sed 's/^/::error::/'
            [ -f app/build/outputs/mapping/release/missing_rules.txt ] && { echo "::error::missing_rules.txt :"; sed 's/^/::error::/' app/build/outputs/mapping/release/missing_rules.txt | head -40; }
            exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
      # Lot 4 (audit 2026-11-02 mobile P2-2) : build de recette terrain (serveur de dev, R8, aucun journal HTTP, .staging)
      - uses: actions/upload-artifact@v7
        with:
          name: android-staging-apk
          path: android/app/build/outputs/apk/staging/*.apk
          retention-days: 14
          if-no-files-found: error

  # ────────────────────────────────────────────────────────────────
  docker:
    name: Images Docker + nginx -t
    runs-on: ubuntu-latest
    # Reliquat 2026-11 : sur un push vers main, les cinq images cplus-* (api, admin, merchant, cardholder, partners)
    # sont publiees sur GHCR sous <version>-<sha12> ; scripts/deploy.sh les recupere au lieu de reconstruire sur le VPS.
    permissions:
      contents: read
      packages: write
    env:
      GHCR_PREFIX: ghcr.io/${{ github.repository_owner }}/cpay
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Lot 7 (audit P2-11) : l'image API est demarree (tini, entrypoint, migrations, utilisateur cplus) contre un
    # PostgreSQL 16 et doit repondre 200 sur /health — jusqu'ici elle n'etait validee qu'en production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cplus_ci
          POSTGRES_DB: cplus_ci
          POSTGRES_HOST_AUTH_METHOD: trust   # base jetable du runner : aucun mot de passe a stocker dans le workflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cplus_ci -d cplus_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image API (docker/Dockerfile.api)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: cplus-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Demarrage de l'image API (migrations + /health) — lot 7
        run: |
          # Valeurs factices valides pour validateEnv (NODE_ENV=production) : rien n'est publie, aucun operateur n'est appele.
          CI_DB_PASSWORD="$(openssl rand -hex 12)"   # ignore par le service (trust)
          cat > "$RUNNER_TEMP/api.env" <<ENV
          NODE_ENV=production
          PORT=3000
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_NAME=cplus_ci
          DB_USER=cplus_ci
          DB_PASSWORD=$CI_DB_PASSWORD
          JWT_SECRET=ci-jwt-secret-0123456789abcdef0123456789abcdef
          INTERNAL_TOKEN=ci-internal-token-0123456789abcdef
          METRICS_TOKEN=ci-metrics-token-0123456789abcdef
          CONFIG_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          WEBHOOK_PATH_SECRET=ci-webhook-path-secret-0123456789
          API_BASE_URL=https://api.ci.invalid
          PAY_LINK_BASE_URL=https://pay.ci.invalid
          ALLOWED_ORIGINS=https://admin.ci.invalid
          GRAFANA_PASSWORD=$CI_DB_PASSWORD
          CERTBOT_EMAIL=ci@ci.invalid
          RECONCILE_ENABLED=false
          LOG_LEVEL=warn
          ENV
          docker run -d --name api-ci --network host --env-file "$RUNNER_TEMP/api.env" cplus-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >"$RUNNER_TEMP/health.json" 2>/dev/null; then break; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/health.json" 2>/dev/null || true
          grep -q '"status":"ok"' "$RUNNER_TEMP/health.json" 2>/dev/null || { echo "::error::l'image API ne repond pas 200 sur /health"; docker logs api-ci | tail -50; exit 1; }
          docker exec api-ci id -u | grep -qv '^0$' || { echo "::error::l'API tourne en root dans le conteneur"; exit 1; }
          docker rm -f api-ci >/dev/null
      - name: Image portail marchand (docker/Dockerfile.portal, APP_DIR=portal/merchant)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.portal
          build-args: |
            APP_DIR=portal/merchant
            REACT_APP_API_BASE_URL=https://api.c-pay.global
          push: false
          tags: cplus-merchant:ci
          load: true
          cache-from: type=gha,scope=merchant
          cache-to: type=gha,scope=merchant,mode=max
      - name: Image portail partenaires (portal/partners/Dockerfile)
        uses: docker/build-push-action@v7
        with:
          context: portal/partners
          file: portal/partners/Dockerfile
          build-args: |
            REACT_APP_API_BASE_URL=https://api.c-pay.global
          push: false
          load: true
          tags: cplus-partners:ci
          cache-from: type=gha,scope=partners
          cache-to: type=gha,scope=partners,mode=max
      - name: Images portails admin et porteur (docker/Dockerfile.portal) — publiees sur GHCR avec les autres
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.portal
          build-args: |
            APP_DIR=portal/admin
            REACT_APP_API_BASE_URL=https://api.c-pay.global
          push: false
          load: true
          tags: cplus-admin:ci
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.portal
          build-args: |
            APP_DIR=portal/cardholder
            REACT_APP_API_BASE_URL=https://api.c-pay.global
          push: false
          load: true
          tags: cplus-cardholder:ci
          cache-from: type=gha,scope=cardholder
          cache-to: type=gha,scope=cardholder,mode=max
      - name: "Demarrage des images portails (hotfix 2026-11-10 : un nginx -t en root au build mettait les conteneurs en boucle)"
        run: |
          # Memes contraintes qu'en production (docker-compose.yml) : sans root, sans capacite, memoire bornee.
          for img in cplus-merchant:ci cplus-partners:ci cplus-admin:ci cplus-cardholder:ci; do
            name="${img%%:*}-run"
            docker run -d --name "$name" -p 18080:8080 --security-opt no-new-privileges:true --cap-drop ALL --memory 128m "$img"
            ok=0
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:18080/ 2>/dev/null | grep -q '<html'; then ok=1; break; fi
              sleep 1
            done
            if [ "$ok" != 1 ]; then echo "::error::$img ne sert pas index.html sur :8080"; docker logs "$name" | tail -30; exit 1; fi
            curl -sSI http://127.0.0.1:18080/ | grep -qi '^content-security-policy:' || { echo "::error::$img : en-tete Content-Security-Policy absent"; exit 1; }
            docker exec "$name" id -u | grep -qv '^0$' || { echo "::error::$img tourne en root"; exit 1; }
            echo "ok $img (uid $(docker exec "$name" id -u), CSP presente)"
            docker rm -f "$name" >/dev/null
          done
      - name: Connexion a GHCR (push vers main uniquement)
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication des images sur GHCR (<version>-<sha12>, memes images que celles demarrees ci-dessus)
        if: env.PUBLISH == 'true'
        run: |
          TAG="$(tr -d '[:space:]' < VERSION)-${GITHUB_SHA:0:12}"
          for img in cplus-api cplus-admin cplus-merchant cplus-cardholder cplus-partners; do
            docker tag "$img:ci" "$GHCR_PREFIX/$img:$TAG"
            docker push -q "$GHCR_PREFIX/$img:$TAG"
            echo "publie : $GHCR_PREFIX/$img:$TAG"
          done
          echo "::notice::images $TAG publiees sur $GHCR_PREFIX — scripts/deploy.sh les recupere (docker login ghcr.io requis si les paquets sont prives)"
      - name: nginx -t — vitrine (nginx-landing.conf) et portails (nginx-spa.conf)
        run: |
          docker run --rm \
            -v "$PWD/docker/nginx-landing.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/portal/landing:/usr/share/nginx/html:ro" \
            nginxinc/nginx-unprivileged:1.28-alpine nginx -t
          docker run --rm \
            -v "$PWD/docker/nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.28-alpine nginx -t
          docker run --rm \
            -v "$PWD/portal/partners/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.28-alpine nginx -t
      - name: docker compose config (lot 7, audit P2-11 — un compose invalide ne doit plus attendre le deploiement)
        run: |
          printf 'DB_HOST=x\nDB_NAME=x\nDB_USER=x\nDB_PASSWORD=x\nJWT_SECRET=x\nINTERNAL_TOKEN=x\n' > backend/.env
          printf 'INTERNAL_TOKEN=x\n' > docker/.cron.env   # genere par scripts/deploy.sh en production
          docker compose -f docker/docker-compose.yml config -q
          # settlement-cron ne doit voir que INTERNAL_TOKEN (reliquat 2026-11)
          docker compose -f docker/docker-compose.yml config --format json \
            | python3 -c "import json,sys; e=json.load(sys.stdin)['services']['settlement-cron'].get('environment',{}); assert set(e)=={'INTERNAL_TOKEN'}, e; print('settlement-cron: environnement limite a INTERNAL_TOKEN')"
          rm -f backend/.env docker/.cron.env
      - name: nginx -t — reverse proxy hote (nginx.conf, certificats factices)
        run: |
          mkdir -p "$RUNNER_TEMP/le/live/c-pay.global"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=c-pay.global' \
            -keyout "$RUNNER_TEMP/le/live/c-pay.global/privkey.pem" \
            -out "$RUNNER_TEMP/le/live/c-pay.global/fullchain.pem" 2>/dev/null
          cp "$RUNNER_TEMP/le/live/c-pay.global/fullchain.pem" "$RUNNER_TEMP/le/live/c-pay.global/chain.pem"
          openssl dhparam -dsaparam -out "$RUNNER_TEMP/dhparam.pem" 2048 2>/dev/null
          # les upstreams sont des noms de services compose : resolus vers localhost pour le test
          docker run --rm \
            --add-host api:127.0.0.1 --add-host admin-portal:127.0.0.1 --add-host merchant-portal:127.0.0.1 \
            --add-host landing:127.0.0.1 --add-host cardholder-portal:127.0.0.1 --add-host partners-portal:127.0.0.1 \
            -v "$PWD/docker/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$RUNNER_TEMP/le:/etc/letsencrypt:ro" \
            -v "$RUNNER_TEMP/dhparam.pem:/etc/nginx/dhparam.pem:ro" \
            nginx:1.28-alpine nginx -t 2>&1 | tee "$RUNNER_TEMP/nginx-t.log"
          if grep -qE "emerg|error" "$RUNNER_TEMP/nginx-t.log"; then
            grep -E "emerg|error" "$RUNNER_TEMP/nginx-t.log" | head -10 | sed 's/^/::error::nginx: /'; exit 1
          fi

  # ────────────────────────────────────────────────────────────────
  version-check:
    name: Versions et scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Toutes les versions = VERSION
        run: bash scripts/check-version.sh
      - name: Bibliotheque env.sh (lecture .env sans execution, valeurs piegees)
        run: bash scripts/tests/env-lib.test.sh
      - name: Syntaxe des scripts shell
        run: |
          for f in scripts/*.sh docker/api-entrypoint.sh; do
            case "$(head -1 "$f")" in
              *bash*) bash -n "$f" ;;
              *)      sh -n "$f" ;;
            esac && echo "ok $f"
          done
