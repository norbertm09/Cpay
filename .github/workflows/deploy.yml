# Deploiement C-Pay — voir docs/ENVIRONNEMENTS.md et docs/CI-CD.md
#
# Deux environnements GitHub, memes noms de secrets dans chacun (Settings → Environments) :
#   development  ← branche develop  (serveur de developpement, deploiement automatique apres CI verte)
#   production   ← branche main     (serveur de production, « required reviewers » recommandes)
# Declencheurs : CI verte sur develop/main (workflow_run), a la main (workflow_dispatch, choix de
# l'environnement), release publiee (production).
# Variables d'environnement GitHub (Settings → Environments → <env> → Variables) :
#   CPAY_DOMAIN  domaine de l'environnement (c-pay.global | dev.c-pay.global) — smoke test et URL
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible'
        type: choice
        required: true
        default: development
        options: [development, production]
      ref:
        description: 'Commit, branche ou tag a deployer (ex. develop, main, v2.7.0)'
        type: string
        required: true
        default: develop
      skip_backup:
        description: 'Ne pas sauvegarder la base avant le deploiement'
        type: boolean
        required: false
        default: false
  release:
    types: [published]
  # Deploiement automatique : des que le pipeline CI est vert sur develop (→ development) ou main (→ production)
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  plan:
    name: Environnement cible
    # Sur workflow_run : uniquement si la CI a reussi
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      ref: ${{ steps.plan.outputs.ref }}
      args: ${{ steps.plan.outputs.args }}
    steps:
      - name: Determiner l'environnement et la reference
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_SKIP_BACKUP: ${{ inputs.skip_backup }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -eu
          case "$EVENT" in
            workflow_dispatch) ENVIRONMENT="$INPUT_ENV"; REF="$INPUT_REF" ;;
            release)           ENVIRONMENT="production";  REF="$RELEASE_TAG" ;;
            workflow_run)
              case "$RUN_BRANCH" in
                main)    ENVIRONMENT="production" ;;
                develop) ENVIRONMENT="development" ;;
                *) echo "::error::branche $RUN_BRANCH sans environnement"; exit 1 ;;
              esac
              REF="$RUN_SHA" ;;
            *) echo "::error::evenement $EVENT non gere"; exit 1 ;;
          esac
          # Garde-fou : la production ne se deploie que depuis main ou un tag vX.Y.Z (ou un SHA de main via workflow_run)
          if [ "$ENVIRONMENT" = "production" ] && [ "$EVENT" = "workflow_dispatch" ]; then
            case "$REF" in main|v[0-9]*) ;; *) echo "::error::production : ref autorisees = main ou tag vX.Y.Z (recu '$REF')"; exit 1 ;; esac
          fi
          # ref stricte : pas d'espace, de quote ni de `..` (elle est injectee dans la commande distante)
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,120}$' || printf '%s' "$REF" | grep -q '\.\.'; then
            echo "::error::reference invalide : '$REF'"; exit 1
          fi
          ARGS=""
          [ "$INPUT_SKIP_BACKUP" = "true" ] && ARGS="--skip-backup"
          { echo "environment=$ENVIRONMENT"; echo "ref=$REF"; echo "args=$ARGS"; } >> "$GITHUB_OUTPUT"
          echo "Deploiement de '$REF' vers $ENVIRONMENT ${ARGS:+($ARGS)}"

  deploy:
    name: Deploiement ${{ needs.plan.outputs.environment }} (/opt/cplus)
    needs: plan
    runs-on: ubuntu-latest
    # Jamais deux deploiements en parallele sur le meme environnement, et on n'annule pas un deploiement en cours
    concurrency:
      group: deploy-${{ needs.plan.outputs.environment }}
      cancel-in-progress: false
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: https://${{ vars.CPAY_DOMAIN || 'c-pay.global' }}
    env:
      OVH_SSH_HOST: ${{ secrets.OVH_SSH_HOST }}
      OVH_SSH_PORT: ${{ secrets.OVH_SSH_PORT || '22' }}
      OVH_SSH_USER: ${{ secrets.OVH_SSH_USER }}
      CPAY_DOMAIN: ${{ vars.CPAY_DOMAIN || 'c-pay.global' }}
      TARGET_ENV: ${{ needs.plan.outputs.environment }}
      REF: ${{ needs.plan.outputs.ref }}
      DEPLOY_ARGS: ${{ needs.plan.outputs.args }}
    steps:
      - name: Cle SSH et known_hosts
        env:
          OVH_SSH_KEY: ${{ secrets.OVH_SSH_KEY }}
          OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
        run: |
          set -eu
          for v in OVH_SSH_HOST OVH_SSH_USER OVH_SSH_KEY; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || { echo "::error::secret $v manquant pour l'environnement (Settings → Environments → secrets)"; exit 1; }
          done
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$OVH_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          if [ -n "$OVH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$OVH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          else
            echo "::warning::OVH_KNOWN_HOSTS absent : empreinte du serveur acceptee au premier contact (ssh-keyscan). Renseigner le secret pour eviter une attaque de l'homme du milieu."
            ssh-keyscan -p "$OVH_SSH_PORT" -H "$OVH_SSH_HOST" > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
            [ -s "$RUNNER_TEMP/ssh/known_hosts" ] || { echo "::error::ssh-keyscan n'a rien retourne"; exit 1; }
          fi
          # Garde-fou : l'environnement development doit avoir sa propre variable CPAY_DOMAIN (sinon ses secrets
          # retombent sur ceux du depot et un deploiement de develop irait sur le serveur de production)
          if [ "$TARGET_ENV" = "development" ] && [ "$CPAY_DOMAIN" = "c-pay.global" ]; then
            echo "::error::environnement development non configure : definir la variable CPAY_DOMAIN=dev.c-pay.global et ses secrets OVH_* (Settings → Environments → development)"; exit 1
          fi
          echo "cible : $TARGET_ENV = $OVH_SSH_USER@$OVH_SSH_HOST ($CPAY_DOMAIN)"

      - name: Deploiement distant (git checkout + scripts/deploy.sh)
        run: |
          set -eu
          ssh -i "$RUNNER_TEMP/ssh/key" -p "$OVH_SSH_PORT" \
              -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o StrictHostKeyChecking=yes \
              -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
              "$OVH_SSH_USER@$OVH_SSH_HOST" "REF='$REF' DEPLOY_ARGS='$DEPLOY_ARGS' sh -s" <<'REMOTE'
          set -eu
          cd /opt/cplus
          echo "== $(hostname) : $(git rev-parse --short HEAD) -> $REF"
          git fetch --all --tags --prune
          TARGET="$REF"
          # une branche se deploie depuis origin/<branche> (la branche locale n'est pas mise a jour par fetch)
          if git rev-parse -q --verify "refs/remotes/origin/$REF" >/dev/null 2>&1; then TARGET="origin/$REF"; fi
          git -c advice.detachedHead=false checkout --detach "$TARGET"
          echo "== commit $(git rev-parse HEAD) — version $(cat VERSION)"
          ./scripts/deploy.sh $DEPLOY_ARGS
          REMOTE

      - name: Smoke test HTTP depuis le runner
        run: |
          set -eu
          check() { # check <url> <motif attendu>
            for i in $(seq 1 12); do
              body="$(curl -fsS --max-time 10 "$1" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -q "$2"; then echo "ok  $1"; return 0; fi
              sleep 5
            done
            echo "::error::$1 ne repond pas comme attendu ($2)"; return 1
          }
          check "https://api.$CPAY_DOMAIN/health" '"status":"ok"'
          check "https://$CPAY_DOMAIN/" '<html'
          DEPLOYED="$(curl -fsS --max-time 10 "https://api.$CPAY_DOMAIN/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          echo "version exposee par /health : ${DEPLOYED:-?}"
          case "$REF" in
            v[0-9]*) [ "$DEPLOYED" = "${REF#v}" ] || { echo "::error::/health expose $DEPLOYED, attendu ${REF#v}"; exit 1; } ;;
          esac

      - name: Nettoyage de la cle
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
