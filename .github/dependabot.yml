# Lot 7 (audit 2026-11-02 infra P2-9 / P2-10) : montees de version proposees automatiquement.
# Les actions GitHub sont suivies ici (le depot ne peut pas lire les depots tiers pour epingler par SHA a la main) ;
# Dependabot propose aussi les images Docker (node, nginx-unprivileged, alpine, certbot, exporters) et les lockfiles npm.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Africa/Brazzaville }
    labels: [dependances, ci]
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: docker
    directories: ["/docker", "/portal/partners", "/monitoring"]
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Africa/Brazzaville }
    labels: [dependances, docker]
    ignore:
      # Node : on reste sur la LTS choisie (22, fin de support avril 2027) ; le passage a 24/26 se fait en une PR dediee
      # (CI, Dockerfile.api, Dockerfile.portal, partners) apres test, pas image par image.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # nginx : versions mineures impaires = branche mainline (1.29, 1.31…) ; on suit la branche stable (1.28 -> 1.30)
      - dependency-name: nginxinc/nginx-unprivileged
        update-types: ["version-update:semver-minor"]
      - dependency-name: nginx
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Africa/Brazzaville }
    labels: [dependances, backend]
    open-pull-requests-limit: 5
    groups:
      backend-minor: { update-types: [minor, patch] }
    ignore:
      # uuid >= 13 est ESM uniquement : incompatible avec le backend CommonJS (remplacement prevu par crypto.randomUUID)
      - dependency-name: uuid
        update-types: ["version-update:semver-major"]
      # Express 5 : migration dediee (routeurs, erreurs async, path-to-regexp) — la CI echoue sur la montee brute
      - dependency-name: express
        update-types: ["version-update:semver-major"]
      # SDK Anthropic 1.x : montee avec le guide de migration 0.x -> 1.x et test de l'assistant, en PR dediee
      - dependency-name: "@anthropic-ai/sdk"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directories: ["/portal/admin", "/portal/merchant", "/portal/cardholder", "/portal/partners", "/portal/bank", "/portal/agency", "/portal/agent"]
    schedule: { interval: monthly }
    labels: [dependances, portails]
    open-pull-requests-limit: 3
    groups:
      portails-minor: { update-types: [minor, patch] }
    ignore:
      # React 19 et Vitest 5 : migrations a mener en une fois sur les 7 portails (PR dediee), pas en 14 PR separees
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      # React Router 7 : avec la migration React 19, en une fois sur les 7 portails
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /mobile/cpay-mobile
    schedule: { interval: monthly }
    labels: [dependances, mobile]
    open-pull-requests-limit: 2
    ignore:
      # Les versions des paquets Expo sont dictees par le SDK (npx expo install --fix), pas par Dependabot
      - dependency-name: "expo*"
      - dependency-name: "@expo/*"
      - dependency-name: "babel-preset-expo"
      - dependency-name: "@babel/*"
      - dependency-name: "react-native*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"

  - package-ecosystem: gradle
    directory: /android
    schedule: { interval: monthly }
    labels: [dependances, android]
    open-pull-requests-limit: 2
    groups:
      # Room : runtime, ktx et compiler doivent bouger ensemble ; AndroidX groupe pour un seul build de verification
      androidx: { patterns: ["androidx.*"] }
      kotlin: { patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"] }
    ignore:
      # Lot Android P2 (2026-11-10) : la chaine est AGP 8.11.1 / Gradle 8.13 / compileSdk 36 / Kotlin 2.2.21.
      # Les versions suivantes exigent compileSdk 37 (androidx.core 1.18+, navigation 2.10+, okhttp-android 5.5+),
      # AGP >= 8.12 (KSP 2.3+) ou Gradle 9 (gradle-wrapper 9.x) : elles seront prises ensemble dans le lot
      # « AGP 9 / API 37 » (docs/MOBILE-STORES.md § 1.7). D'ici la, Dependabot ne propose que ce qui compile.
      - dependency-name: "androidx.core:*"
        versions: [">= 1.18"]
      - dependency-name: "androidx.navigation:*"
        versions: [">= 2.10"]
      - dependency-name: "androidx.fragment:*"
        versions: [">= 1.9"]
      - dependency-name: "androidx.activity:*"
        versions: [">= 1.12"]
      - dependency-name: "androidx.lifecycle:*"
        versions: [">= 2.10"]
      - dependency-name: "androidx.appcompat:*"
        versions: [">= 1.8"]
      - dependency-name: "androidx.room:*"
        versions: [">= 2.9"]
      - dependency-name: "androidx.test*"
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.google.devtools.ksp*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "com.squareup.okhttp3:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.library"
        update-types: ["version-update:semver-major"]
