<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 112">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4f92"/>
      <stop offset="100%" stop-color="#005a96"/>
    </linearGradient>
  </defs>

  <!-- Cercle fond bleu -->
  <circle cx="56" cy="56" r="52" fill="url(#bg)"/>

  <!-- Arc cyan gauche-bas -->
  <path d="M 12 70 Q 6 42 28 20 Q 42 8 56 6"
        fill="none" stroke="#00c8c8" stroke-width="11" stroke-linecap="round"/>
  <path d="M 12 70 Q 16 94 40 104 Q 56 110 72 100"
        fill="none" stroke="#00b4b4" stroke-width="11" stroke-linecap="round"/>

  <!-- Flèche blanche -->
  <polygon points="56,16 42,42 50,42 50,72 62,72 62,42 70,42" fill="white"/>

  <!-- Pixels décoratifs -->
  <rect x="76" y="10" width="9" height="9" fill="#00c8c8" rx="2"/>
  <rect x="88" y="10" width="9" height="9" fill="#00c8c8" rx="2" opacity="0.55"/>
  <rect x="88" y="22" width="9" height="9" fill="#00c8c8" rx="2" opacity="0.3"/>

  <!-- CALCULUS -->
  <text x="122" y="58"
    font-family="'Century Gothic','AppleGothic','Gill Sans MT',Tahoma,Arial,sans-serif"
    font-size="34" font-weight="700" fill="#1d4f92" letter-spacing="1">CALCULUS</text>

  <!-- PLUS -->
  <text x="348" y="58"
    font-family="'Century Gothic','AppleGothic','Gill Sans MT',Tahoma,Arial,sans-serif"
    font-size="34" font-weight="700" fill="#00b4c8" letter-spacing="1"> PLUS</text>

  <!-- Ligne gauche tagline -->
  <line x1="122" y1="72" x2="147" y2="72" stroke="#aaa" stroke-width="1"/>

  <!-- Tagline -->
  <text x="153" y="76"
    font-family="'Century Gothic','AppleGothic','Gill Sans MT',Tahoma,Arial,sans-serif"
    font-size="9.5" fill="#888" letter-spacing="3">INNOVER.  TRANSFORMER.  RÉUSSIR.</text>

  <!-- Ligne droite tagline -->
  <line x1="428" y1="72" x2="530" y2="72" stroke="#aaa" stroke-width="1"/>
</svg>
