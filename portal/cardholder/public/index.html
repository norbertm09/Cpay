<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12b6c7" />
    <title>C-Pay — Carte Virtuelle</title>
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      /* Inter (corps) et Jost (titres) — polices variables auto-hebergees,
         identiques a celles du portail ToonaPay. Subset latin uniquement.
         font-weight: 100 900 = plage variable, pas une valeur unique. */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Jost';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/jost-latin.woff2') format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Century Gothic via Google Fonts fallback (Nunito est très proche) */
      * {
        font-family:Inter,'Century Gothic','URW Gothic',Jost,system-ui,sans-serif!important;
      }
      body {
        margin: 0;
        font-family:Inter,'Century Gothic','URW Gothic',Jost,system-ui,sans-serif!important;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      input, button, select, textarea {
        font-family:Inter,'Century Gothic','URW Gothic',Jost,system-ui,sans-serif!important;
      }
    </style>
  </head>
  <body>
    <noscript>JavaScript requis</noscript>
    <div id="root"></div>
  </body>
</html>
