# ================================================================
# CPlus 2.6 — Nginx production OVH
# TLS 1.3, HSTS, rate limiting, gzip, cache statiques
# ================================================================

user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 2048;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ─── Logging structuré ────────────────────────────────────────
  log_format json_combined escape=json
    '{"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"referer":"$http_referer",'
    '"ua":"$http_user_agent",'
    '"rt":"$request_time",'
    '"host":"$host"}';

  access_log /var/log/nginx/access.log json_combined;

  # ─── Perf ─────────────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  server_tokens      off;
  client_max_body_size 10m;

  # ─── Gzip ─────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json
             application/javascript application/xml+rss
             application/atom+xml image/svg+xml;

  # ─── Rate limiting zones ──────────────────────────────────────
  limit_req_zone  $binary_remote_addr zone=api_general:20m  rate=60r/m;
  limit_req_zone  $binary_remote_addr zone=api_auth:10m     rate=10r/m;
  limit_req_zone  $binary_remote_addr zone=api_payment:10m  rate=30r/m;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # ─── Upstreams ────────────────────────────────────────────────
  upstream cplus_api {
    server api:3000;
    keepalive 32;
  }

  upstream cplus_admin {
    server admin-portal:80;
    keepalive 8;
  }

  upstream cplus_merchant {
    server merchant-portal:80;
    keepalive 8;
  }
  upstream cplus_landing {
    server landing:80;
    keepalive 8;
  }

  upstream cplus_cardholder {
    server cardholder-portal:80;   # nom de service Docker (l'IP de bridge figée changeait à chaque `compose up`)
    keepalive 8;
  }

  # ─── Upgrade WebSocket ────────────────────────────────────────
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ─── HTTP → HTTPS redirect ────────────────────────────────────
  server {
    listen 80 default_server;
    server_name c-pay.global www.c-pay.global api.c-pay.global admin.c-pay.global merchant.c-pay.global pay.c-pay.global app.c-pay.global card.c-pay.global;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── Headers sécurité communs ─────────────────────────────────
  map $host $security_headers {
    default 1;
  }

  # ─── API — api.c-pay.global ───────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.c-pay.global pay.c-pay.global;

    ssl_certificate     /etc/letsencrypt/live/c-pay.global/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c-pay.global/privkey.pem;

    # TLS optimisé
    ssl_session_timeout  1d;
    ssl_session_cache    shared:MozSSL:10m;
    ssl_session_tickets  off;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparam.pem;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/c-pay.global/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none';" always;

    limit_conn conn_limit 50;

    # Endpoints internes et métriques : jamais exposés publiquement (Prometheus scrape api:3000 dans le réseau Docker)
    location ^~ /internal/ { return 404; }
    location = /metrics    { return 404; }

    # Auth endpoints — rate limit strict (tous les acteurs)
    location ~ ^/api/v1/(admin|merchant|cardholder|partners|bank|agency|agent)/auth {
      limit_req zone=api_auth burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://cplus_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_read_timeout 30s;
      proxy_connect_timeout 10s;
    }

    # Payment endpoints — routes legacy ET routes réellement utilisées par les apps
    location ~ ^/api/v1/(collect|payout|pay/|merchant/(collect|disburse|withdraw|transfer)|cardholder/(payment|topup|unload)) {
      limit_req zone=api_payment burst=10 nodelay;
      limit_req_status 429;
      proxy_pass http://cplus_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_read_timeout 90s;  # Mobile Money peut prendre 60s
      proxy_connect_timeout 10s;
    }

    # Tout le reste
    location / {
      limit_req zone=api_general burst=30 nodelay;
      limit_req_status 429;
      proxy_pass http://cplus_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
    }
  }

  # ─── Admin portal — admin.c-pay.global ───────────────────────
  server {
    listen 443 ssl http2;
    server_name admin.c-pay.global;

    ssl_certificate     /etc/letsencrypt/live/c-pay.global/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c-pay.global/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:MozSSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Restriction IP pour l'admin (optionnel — décommenter et adapter)
    # allow 41.x.x.x;   # IP bureau
    # deny all;

    location / {
      proxy_pass http://cplus_admin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      # Cache agressif pour les assets statiques React
      location ~* \.(js|css|png|jpg|ico|woff2?)$ {
        proxy_pass http://cplus_admin;
        expires 30d;
        add_header Cache-Control "public, immutable";
      }
    }
  }

  # ─── Merchant portal — merchant.c-pay.global ─────────────────
  server {
    listen 443 ssl http2;
    server_name merchant.c-pay.global;

    ssl_certificate     /etc/letsencrypt/live/c-pay.global/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c-pay.global/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:MozSSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
      proxy_pass http://cplus_merchant;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

  }
  # ─── Vitrine — c-pay.global / www.c-pay.global ───────────────
  server {
    listen 443 ssl;
    http2 on;
    server_name c-pay.global www.c-pay.global;

    ssl_certificate     /etc/letsencrypt/live/c-pay.global/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c-pay.global/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:MozSSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.c-pay.global; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; frame-ancestors 'none'; form-action 'self' https://api.c-pay.global" always;

    if ($host = www.c-pay.global) { return 301 https://c-pay.global$request_uri; }

    location / {
      proxy_pass http://cplus_landing;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  # ─── app.c-pay.global / card.c-pay.global (Cardholder) ───────
  server {
    listen 443 ssl;
    http2 on;
    server_name app.c-pay.global card.c-pay.global;

    ssl_certificate     /etc/letsencrypt/live/c-pay.global/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c-pay.global/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:MozSSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
      proxy_pass http://cplus_cardholder;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      # Le fallback SPA est géré par nginx-spa.conf dans le conteneur du portail
    }
  }

}
