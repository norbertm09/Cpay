server {
  listen 8080;   # lot 7 : image nginx-unprivileged (pas de root dans le conteneur)
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Lot 2 (audit 2026-11-02 portails P1-3) : CSP sur les SPA. Les bundles Vite sont sans script inline
  # (vite.config.js) ; les styles inline (style={{…}}) et l'image data: du QR 2FA restent autorises.
  # __API_ORIGIN__ est remplace au build de l'image par l'origine de l'API (Dockerfile.portal, REACT_APP_API_BASE_URL).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' __API_ORIGIN__; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' __API_ORIGIN__" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
