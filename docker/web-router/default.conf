# ================================================================
# C-Pay — routeur bleu/vert des portails (portails sans coupure, 2026-11)
# Le nginx de l'hote proxyfie merchant./app./card./admin./partners. vers 127.0.0.1:3002-3005 : c'est ce conteneur
# (cplus-web-router) qui tient ces ports et relaie vers la couleur active de chaque portail (<portail>-blue ou
# <portail>-green, port 8080). La couleur est dans /etc/nginx/cpay/active.conf (« set $cpay_web_color blue; »),
# ecrite par scripts/deploy.sh puis « nginx -s reload » (gracieux). Resolution a chaque requete (resolver Docker).
# Les portails posent eux-memes leurs en-tetes de securite (CSP…) : le routeur ne touche a rien.
# ================================================================
map $server_port $cpay_portal {
  3002 merchant;
  3003 cardholder;
  3004 admin;
  3005 partners;
}

server {
  listen 3002;
  listen 3003;
  listen 3004;
  listen 3005;
  server_name _;
  resolver 127.0.0.11 valid=5s ipv6=off;
  include /etc/nginx/cpay/active.conf;

  access_log off;
  client_max_body_size 1m;

  location / {
    proxy_pass http://$cpay_portal-$cpay_web_color:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
  }
}
