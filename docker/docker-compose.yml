services:

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: cplus-api:2.6.0
    container_name: cplus-api
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ../backend/.env
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "true"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - cplus-internal

  admin-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
      args:
        APP_DIR: portal/admin
        REACT_APP_API_BASE_URL: https://api.c-pay.global
    image: cplus-admin:2.6.0
    container_name: cplus-admin-portal
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:3004:80"
    networks:
      - cplus-internal

  merchant-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
      args:
        APP_DIR: portal/merchant
        REACT_APP_API_BASE_URL: https://api.c-pay.global
    image: cplus-merchant:2.6.0
    container_name: cplus-merchant-portal
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:3002:80"
    networks:
      - cplus-internal

  nginx:
    image: nginx:1.25-alpine
    container_name: cplus-nginx
    restart: "no"
    profiles: ["standalone-nginx"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./dhparam.pem:/etc/nginx/dhparam.pem:ro
    networks:
      - cplus-internal

  certbot:
    image: certbot/certbot:latest
    container_name: cplus-certbot
    profiles:
      - certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: >
      certonly --webroot -w /var/www/certbot
      --email ${CERTBOT_EMAIL}
      --agree-tos --no-eff-email
      -d c-pay.global
      -d api.c-pay.global
      -d admin.c-pay.global
      -d merchant.c-pay.global
      -d pay.c-pay.global
    networks:
      - cplus-internal

  partners-portal:
    image: cplus-partners:2.6.0
    build:
      context: ../portal/partners
      dockerfile: Dockerfile
    container_name: cplus-partners-portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:80"
    networks:
      - cplus-internal

  cardholder-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
      args:
        APP_DIR: portal/cardholder
        REACT_APP_API_BASE_URL: https://api.c-pay.global
    image: cplus-cardholder:2.6.0
    container_name: cplus-cardholder-portal
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:3003:80"
    networks:
      - cplus-internal

networks:

  cplus-internal:
    driver: bridge
