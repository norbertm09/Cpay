# Variables d'environnement de composition (fichier docker/.env, voir docker/env.example) :
#   CPAY_API_BASE_URL  URL de l'API compilee dans les portails (prod : https://api.c-pay.global,
#                      dev : https://api.dev.c-pay.global). Sans fichier, la valeur de production s'applique.
services:

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: cplus-api:${CPLUS_TAG:-2.7.0}
    container_name: cplus-api
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - ../backend/.env
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "true"
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q ok || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - cplus-internal

  admin-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
      args:
        APP_DIR: portal/admin
        REACT_APP_API_BASE_URL: ${CPAY_API_BASE_URL:-https://api.c-pay.global}
    image: cplus-admin:${CPLUS_TAG:-2.7.0}
    container_name: cplus-admin-portal
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:3004:80"
    networks:
      - cplus-internal

  merchant-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
      args:
        APP_DIR: portal/merchant
        REACT_APP_API_BASE_URL: ${CPAY_API_BASE_URL:-https://api.c-pay.global}
    image: cplus-merchant:${CPLUS_TAG:-2.7.0}
    container_name: cplus-merchant-portal
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:3002:80"
    networks:
      - cplus-internal

  nginx:
    image: nginx:1.25-alpine
    container_name: cplus-nginx
    restart: "no"
    profiles: ["standalone-nginx"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./dhparam.pem:/etc/nginx/dhparam.pem:ro
    networks:
      - cplus-internal

  certbot:
    image: certbot/certbot:latest
    container_name: cplus-certbot
    profiles:
      - certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: >
      certonly --webroot -w /var/www/certbot
      --email ${CERTBOT_EMAIL:-admin@c-pay.global}
      --agree-tos --no-eff-email
      -d c-pay.global
      -d api.c-pay.global
      -d admin.c-pay.global
      -d merchant.c-pay.global
      -d pay.c-pay.global
      -d app.c-pay.global
      -d card.c-pay.global
    networks:
      - cplus-internal

  partners-portal:
    image: cplus-partners:${CPLUS_TAG:-2.7.0}
    build:
      context: ../portal/partners
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${CPAY_API_BASE_URL:-https://api.c-pay.global}
    container_name: cplus-partners-portal
    restart: unless-stopped
    ports:
      - "127.0.0.1:3005:80"
    networks:
      - cplus-internal

  cardholder-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
      args:
        APP_DIR: portal/cardholder
        REACT_APP_API_BASE_URL: ${CPAY_API_BASE_URL:-https://api.c-pay.global}
    image: cplus-cardholder:${CPLUS_TAG:-2.7.0}
    container_name: cplus-cardholder-portal
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:3003:80"
    networks:
      - cplus-internal

  # Vitrine c-pay.global (statique, sans build)
  landing:
    image: nginx:1.27-alpine
    container_name: cplus-landing
    restart: unless-stopped
    volumes:
      - ../portal/landing:/usr/share/nginx/html:ro
      - ./nginx-landing.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    ports:
      - "127.0.0.1:3006:80"
    networks:
      - cplus-internal

  # Règlement J+1 : appelle l'API chaque nuit à 01:15 UTC avec le jeton interne (route bloquée publiquement par nginx)
  settlement-cron:
    image: alpine:3.21
    container_name: cplus-settlement-cron
    restart: unless-stopped
    depends_on: [api]
    env_file:
      - ../backend/.env
    command: >
      sh -c "echo '15 1 * * * wget -qO- --post-data= --header=\"X-Internal-Token: $$INTERNAL_TOKEN\" --header=\"Content-Type: application/json\" http://api:3000/internal/settlement/run' > /etc/crontabs/root && crond -f -l 2"
    networks:
      - cplus-internal

networks:

  cplus-internal:
    driver: bridge
