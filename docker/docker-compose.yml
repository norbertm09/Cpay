version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: calculus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-calculus_db}
      POSTGRES_USER:     ${DB_USER:-calculus_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-calculus_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - calculus-net

  api:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.api
    container_name: calculus-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - calculus-net

  nginx:
    image: nginx:1.25-alpine
    container_name: calculus-nginx
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - calculus-net

volumes:
  postgres_data: { driver: local }

networks:
  calculus-net:
    driver: bridge

  admin-portal:
    build:
      context: ../portal/admin
      args:
        REACT_APP_API_URL: /api/v1/admin
    container_name: cplus-admin-portal
    restart: unless-stopped
    expose: ["80"]
    networks: [calculus-net]

  merchant-portal:
    build:
      context: ../portal/merchant
      args:
        REACT_APP_API_URL: /api/v1/merchant
    container_name: cplus-merchant-portal
    restart: unless-stopped
    expose: ["80"]
    networks: [calculus-net]
