# Variables d'environnement de composition (fichier docker/.env, voir docker/env.example) :
#   CPAY_API_BASE_URL  URL de l'API compilee dans les portails (prod : https://api.c-pay.global,
#                      dev : https://api.dev.c-pay.global). Sans fichier, la valeur de production s'applique.
# Bascule sans coupure de l'API (2026-11, P1-6) : deux couleurs api-blue / api-green partagent la definition
# x-api ; une seule tourne en regime etabli (CPAY_API_BLUE / CPAY_API_GREEN = 1 ou 0, poses par scripts/deploy.sh).
# Le port 127.0.0.1:3001 attendu par le nginx de l'hote est tenu par api-router, qui relaie vers la couleur active
# (docker/api-router/). Les deux couleurs portent l'alias reseau « api » : settlement-cron, Prometheus
# (monitoring) et le nginx du profil standalone continuent de joindre api:3000.
x-api: &api
  build:
    context: ..
    dockerfile: docker/Dockerfile.api
  image: cplus-api:${CPLUS_TAG:-2.7.2}
  restart: unless-stopped
  dns:
    - 8.8.8.8
    - 1.1.1.1
  env_file:
    - ../backend/.env
  environment:
    NODE_ENV: production
    RUN_MIGRATIONS: "true"
  expose:
    - "3000"
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep -q ok || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s
  # SIGTERM -> server.close() (les requetes en cours se terminent) puis fermeture du pool : 45 s de grace
  stop_grace_period: 45s
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 1536m
  cpus: 2

# Portails sans coupure (2026-11) : chaque portail existe en deux couleurs <portail>-blue / <portail>-green
# (definition commune, alias reseau <portail>-portal pour le nginx du profil standalone), une seule couleur active
# pour toute la tranche web (CPAY_WEB_BLUE / CPAY_WEB_GREEN poses par scripts/deploy.sh). Les ports
# 127.0.0.1:3002-3005 attendus par le nginx de l'hote sont tenus par web-router (docker/web-router/).
x-portal: &portal
  restart: unless-stopped
  expose:
    - "8080"
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 128m
  cpus: 0.5

services:

  api-blue:
    <<: *api
    container_name: cplus-api-blue
    scale: ${CPAY_API_BLUE:-1}
    networks:
      cplus-internal:
        aliases: [api]

  api-green:
    <<: *api
    container_name: cplus-api-green
    scale: ${CPAY_API_GREEN:-0}
    networks:
      cplus-internal:
        aliases: [api]

  api-router:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    container_name: cplus-api-router
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:8080"
    volumes:
      - ./api-router/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api-router/active:/etc/nginx/cpay:ro   # active.conf ecrit par deploy.sh (ignore par git)
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 64m
    cpus: 0.25
    networks:
      - cplus-internal



  nginx:
    image: nginx:1.28-alpine
    container_name: cplus-nginx
    restart: "no"
    profiles: ["standalone-nginx"]
    depends_on:
      api-blue:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./dhparam.pem:/etc/nginx/dhparam.pem:ro
    networks:
      - cplus-internal

  certbot:
    image: certbot/certbot:v4.1.1
    container_name: cplus-certbot
    profiles:
      - certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: >
      certonly --webroot -w /var/www/certbot
      --email ${CERTBOT_EMAIL:-admin@c-pay.global}
      --agree-tos --no-eff-email
      -d c-pay.global
      -d api.c-pay.global
      -d admin.c-pay.global
      -d merchant.c-pay.global
      -d pay.c-pay.global
      -d app.c-pay.global
      -d card.c-pay.global
    networks:
      - cplus-internal



  merchant-blue:
    <<: *portal
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
      args:
        APP_DIR: portal/merchant
        REACT_APP_API_BASE_URL: ${CPAY_API_BASE_URL:-https://api.c-pay.global}
    image: cplus-merchant:${CPLUS_TAG:-2.7.2}
    container_name: cplus-merchant-blue
    scale: ${CPAY_WEB_BLUE:-1}
    networks:
      cplus-internal:
        aliases: [merchant-portal]

  merchant-green:
    <<: *portal
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
      args:
        APP_DIR: portal/merchant
        REACT_APP_API_BASE_URL: ${CPAY_API_BASE_URL:-https://api.c-pay.global}
    image: cplus-merchant:${CPLUS_TAG:-2.7.1}
    container_name: cplus-merchant-green
    scale: ${CPAY_WEB_GREEN:-0}
    networks:
      cplus-internal:
        aliases: [merchant-portal]

  cardholder-blue:
    <<: *portal
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
      args:
        APP_DIR: portal/cardholder
        REACT_APP_API_BASE_URL: ${CPAY_API_BASE_URL:-https://api.c-pay.global}
    image: cplus-cardholder:${CPLUS_TAG:-2.7.2}
    container_name: cplus-cardholder-blue
    scale: ${CPAY_WEB_BLUE:-1}
    networks:
      cplus-internal:
        aliases: [cardholder-portal]

  cardholder-green:
    <<: *portal
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
      args:
        APP_DIR: portal/cardholder
        REACT_APP_API_BASE_URL: ${CPAY_API_BASE_URL:-https://api.c-pay.global}
    image: cplus-cardholder:${CPLUS_TAG:-2.7.1}
    container_name: cplus-cardholder-green
    scale: ${CPAY_WEB_GREEN:-0}
    networks:
      cplus-internal:
        aliases: [cardholder-portal]

  admin-blue:
    <<: *portal
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
      args:
        APP_DIR: portal/admin
        REACT_APP_API_BASE_URL: ${CPAY_API_BASE_URL:-https://api.c-pay.global}
    image: cplus-admin:${CPLUS_TAG:-2.7.2}
    container_name: cplus-admin-blue
    scale: ${CPAY_WEB_BLUE:-1}
    networks:
      cplus-internal:
        aliases: [admin-portal]

  admin-green:
    <<: *portal
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
      args:
        APP_DIR: portal/admin
        REACT_APP_API_BASE_URL: ${CPAY_API_BASE_URL:-https://api.c-pay.global}
    image: cplus-admin:${CPLUS_TAG:-2.7.1}
    container_name: cplus-admin-green
    scale: ${CPAY_WEB_GREEN:-0}
    networks:
      cplus-internal:
        aliases: [admin-portal]

  partners-blue:
    <<: *portal
    build:
      context: ../portal/partners
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${CPAY_API_BASE_URL:-https://api.c-pay.global}
    image: cplus-partners:${CPLUS_TAG:-2.7.2}
    container_name: cplus-partners-blue
    scale: ${CPAY_WEB_BLUE:-1}
    networks:
      cplus-internal:
        aliases: [partners-portal]

  partners-green:
    <<: *portal
    build:
      context: ../portal/partners
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${CPAY_API_BASE_URL:-https://api.c-pay.global}
    image: cplus-partners:${CPLUS_TAG:-2.7.1}
    container_name: cplus-partners-green
    scale: ${CPAY_WEB_GREEN:-0}
    networks:
      cplus-internal:
        aliases: [partners-portal]

  # Routeur bleu/vert de la tranche web : 127.0.0.1:3002 marchand, :3003 porteur, :3004 admin, :3005 partenaires
  web-router:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    container_name: cplus-web-router
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
      - "127.0.0.1:3003:3003"
      - "127.0.0.1:3004:3004"
      - "127.0.0.1:3005:3005"
    volumes:
      - ./web-router/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web-router/active:/etc/nginx/cpay:ro   # active.conf ecrit par deploy.sh (ignore par git)
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 64m
    cpus: 0.25
    networks:
      - cplus-internal

  # Vitrine c-pay.global (statique, sans build)
  landing:
    image: nginxinc/nginx-unprivileged:1.28-alpine   # lot 7 : plus de root dans le conteneur, version maintenue
    container_name: cplus-landing
    restart: unless-stopped
    volumes:
      - ../portal/landing:/usr/share/nginx/html:ro
      - ./nginx-landing.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    ports:
      - "127.0.0.1:3006:8080"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 64m
    cpus: 0.25
    networks:
      - cplus-internal

  # Règlement J+1 : appelle l'API chaque nuit à 01:15 UTC avec le jeton interne (route bloquée publiquement par nginx)
  settlement-cron:
    image: alpine:3.21
    container_name: cplus-settlement-cron
    restart: unless-stopped
    # pas de depends_on : « api » est un alias reseau porte par la couleur active (bleu ou vert)
    # Reliquat 2026-11 : seul INTERNAL_TOKEN est necessaire — docker/.cron.env (INTERNAL_TOKEN=…) est genere par
    # scripts/deploy.sh a partir de backend/.env ; le conteneur ne voit plus les secrets DB / JWT / operateurs.
    env_file:
      - ./.cron.env
    command: >
      sh -c "echo '15 1 * * * wget -qO- --post-data= --header=\"X-Internal-Token: $$INTERNAL_TOKEN\" --header=\"Content-Type: application/json\" http://api:3000/internal/settlement/run' > /etc/crontabs/root && crond -f -l 2"
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    cpus: 0.1
    networks:
      - cplus-internal

networks:

  cplus-internal:
    driver: bridge
