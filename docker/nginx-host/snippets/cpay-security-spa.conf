# C-Pay — en-tetes de securite des portails SPA (admin, merchant, app/card, partners, bank, agency, agent)
# Lot 2 (audit 2026-11-02 portails P1-3). A inclure dans chaque bloc server des portails du vhost hote :
#   include snippets/cpay-security-spa.conf;
# Les conteneurs (docker/nginx-spa.conf) posent deja la meme CSP ; la doublonner sur l'hote protege aussi
# un portail servi directement par l'hote. Les deux en-tetes s'appliquent (intersection).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://api.c-pay.global; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.c-pay.global" always;
