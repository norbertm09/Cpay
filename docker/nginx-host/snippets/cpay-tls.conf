# C-Pay — TLS commun (nginx hôte). Certificat Let's Encrypt unique couvrant tous les hôtes c-pay.global.
ssl_certificate         /etc/letsencrypt/live/c-pay.global/fullchain.pem;
ssl_certificate_key     /etc/letsencrypt/live/c-pay.global/privkey.pem;
ssl_trusted_certificate /etc/letsencrypt/live/c-pay.global/chain.pem;
ssl_session_timeout  1d;
ssl_session_cache    shared:CpaySSL:10m;
ssl_session_tickets  off;
ssl_protocols        TLSv1.2 TLSv1.3;
ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_dhparam /etc/nginx/dhparam.pem;
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;
