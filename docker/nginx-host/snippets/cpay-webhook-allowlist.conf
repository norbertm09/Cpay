# C-Pay — allowlist des callbacks operateurs (Mobile Money) sur l'API.
# Inclure ce fichier dans le bloc "http" (nginx.conf ou conf.d) :  include snippets/cpay-webhook-allowlist.conf;
# puis, dans le vhost api.c-pay.global :
#     location ~ ^/api/v1/(webhooks|momo/webhooks)/ {
#         if ($cpay_webhook_denied) { return 403; }
#         proxy_pass http://127.0.0.1:3001;
#         ...
#     }
# Tant que la liste ne contient que "default 0", TOUT est autorise (etat initial : les operateurs n'ont pas
# encore communique leurs plages). Des qu'une plage est ajoutee, passer "default 1" pour refuser le reste.
geo $cpay_webhook_denied {
    default 0;            # 0 = autorise, 1 = refuse  — passer a 1 une fois les plages renseignees
    127.0.0.1 0;
    # --- MTN MoMo (CG) : plages a obtenir aupres de MTN (API Manager / support momodeveloper) ---
    # 41.x.x.x/24 0;
    # --- Airtel Money (CG) : plages openapi.airtel.africa a obtenir aupres d'Airtel ---
    # 196.x.x.x/24 0;
}
