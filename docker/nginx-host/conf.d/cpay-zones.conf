# C-Pay — contexte http du nginx HÔTE : zones de limitation, allowlist des callbacks, carte Upgrade.
# Installé par scripts/init-vps.sh dans /etc/nginx/conf.d/cpay-zones.conf (inclus par le nginx.conf Ubuntu).
# Les blocs server sont dans sites-available/cpay (modèle : docker/nginx-host/cpay.conf.example).
limit_req_zone  $binary_remote_addr zone=api_general:20m rate=60r/m;
limit_req_zone  $binary_remote_addr zone=api_auth:10m    rate=10r/m;
limit_req_zone  $binary_remote_addr zone=api_payment:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
include snippets/cpay-webhook-allowlist.conf;
