# ================================================================
# C-Pay — routeur bleu/vert de l'API (bascule sans coupure, P1-6 seconde moitie, 2026-11)
#
# Le nginx de l'hote continue de proxyfier api.c-pay.global vers 127.0.0.1:3001 : c'est desormais CE conteneur
# (cplus-api-router) qui ecoute sur 3001 et relaie vers la couleur active de l'API (api-blue ou api-green, port 3000).
# La couleur active est le fichier /etc/nginx/cpay/active.conf (« set $cpay_api_upstream api-blue; »), ecrit par
# scripts/deploy.sh puis « nginx -s reload » (rechargement gracieux : aucune connexion perdue). Le nom est resolu a
# chaque requete (resolver Docker) : le routeur demarre meme si la couleur n'existe pas encore.
# Les en-tetes du client (X-Forwarded-For, X-Real-IP, X-Forwarded-Proto) poses par le nginx de l'hote sont
# transmis tels quels : l'API garde « trust proxy 1 » et voit la meme adresse client qu'avant.
# ================================================================
server {
  listen 8080;
  server_name _;
  resolver 127.0.0.11 valid=5s ipv6=off;
  include /etc/nginx/cpay/active.conf;

  access_log off;
  client_max_body_size 20m;

  location / {
    proxy_pass http://$cpay_api_upstream:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    # Une seule tentative sur un autre serveur n'a pas de sens ici (une couleur a la fois) ; pas de rejeu des POST.
    proxy_next_upstream off;
  }
}
