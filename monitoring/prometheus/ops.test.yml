# promtool test rules ops.test.yml — scénarios des alertes d'exploitation (lot 3)
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="node", instance="node-exporter:9100"}'
        values: '1x20 0x20'
      - series: 'up{job="postgres", instance="postgres-exporter:9187"}'
        values: '1x40'
      - series: 'cpay_backup_last_status{instance="node-exporter:9100", job="node"}'
        values: '1x10 0x30'
      - series: 'cpay_backup_remote_copied{instance="node-exporter:9100", job="node"}'
        values: '1x40'
      - series: 'cpay_healthcheck_up{target="api", instance="node-exporter:9100", job="node"}'
        values: '1x40'
      - series: 'cpay_healthcheck_up{target="admin", instance="node-exporter:9100", job="node"}'
        values: '1x25 0x15'
    alert_rule_test:
      - eval_time: 10m
        alertname: ExporterDown
        exp_alerts: []
      - eval_time: 25m
        alertname: ExporterDown
        exp_alerts:
          - exp_labels: { severity: warning, job: node, instance: "node-exporter:9100" }
            exp_annotations: { summary: "Exporter node injoignable : les alertes disque / memoire / PostgreSQL sont aveugles" }
      - eval_time: 20m
        alertname: BackupFailed
        exp_alerts:
          - exp_labels: { severity: critical, instance: "node-exporter:9100", job: node }
            exp_annotations: { summary: "La derniere sauvegarde PostgreSQL a echoue" }
      - eval_time: 5m
        alertname: BackupFailed
        exp_alerts: []
      - eval_time: 30m
        alertname: HealthcheckFailing
        exp_alerts: []
      - eval_time: 38m
        alertname: HealthcheckFailing
        exp_alerts:
          - exp_labels: { severity: critical, target: admin, instance: "node-exporter:9100", job: node }
            exp_annotations: { summary: "Health check externe KO sur admin depuis 10 minutes" }
  - interval: 1h
    input_series:
      # expiration dans 10 jours au départ, le temps avance d'une heure par pas
      - series: 'cpay_cert_expiry_timestamp_seconds{cert="c-pay.global-0001", instance="node-exporter:9100", job="node"}'
        values: '864000x30'
      - series: 'cpay_certbot_timer_enabled{instance="node-exporter:9100", job="node"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 2h
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels: { severity: warning, cert: c-pay.global-0001, instance: "node-exporter:9100", job: node }
            exp_annotations: { summary: "Certificat TLS c-pay.global-0001 expire dans moins de 14 jours" }
      - eval_time: 2h
        alertname: CertificateExpiryCritical
        exp_alerts: []
      - eval_time: 2h
        alertname: CertbotTimerDisabled
        exp_alerts:
          - exp_labels: { severity: warning, instance: "node-exporter:9100", job: node }
            exp_annotations: { summary: "certbot.timer inactif : plus de renouvellement automatique des certificats" }
