global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    env: production
    service: cplus

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: cplus-api
    static_configs:
      - targets: ['api:3000']
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics_token
    scrape_interval: 15s

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
