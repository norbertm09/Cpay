# Pile de supervision — fichier de RÉFÉRENCE (vague 7, suite du lot 5B).
#
# Il n'est démarré ni par docker/docker-compose.yml ni par scripts/deploy.sh : l'exploitant
# l'active explicitement après avoir généré et validé la configuration Alertmanager
# (docs/LOT-5B-ALERTES.md). Son rôle est de rendre explicites les montages des fichiers secrets :
#
#   - le token du scrape API est monté à /etc/prometheus/secrets/metrics_token, chemin attendu par
#     monitoring/prometheus/prometheus.yml (authorization.credentials_file) ; son contenu doit être
#     identique à METRICS_TOKEN de backend/.env ;
#   - la configuration Alertmanager générée référence des chemins ABSOLUS de l'hôte (fichier mot de
#     passe SMTP, template, CA éventuelle) : ils doivent exister à l'identique dans le conteneur.
#
# Variables attendues (fichier d'environnement privé, jamais backend/.env) :
#   MONITORING_METRICS_TOKEN_FILE   fichier privé contenant le token (celui validé par le générateur)
#   ALERTMANAGER_CONFIG_FILE        configuration générée par scripts/configure-monitoring.cjs
#   ALERT_SMTP_PASSWORD_FILE        fichier privé du mot de passe SMTP (même chemin dans le conteneur)
#   MONITORING_TEMPLATE_DIR         chemin absolu de monitoring/alertmanager sur l'hôte
#   CPLUS_NETWORK                   réseau applicatif (défaut docker_cplus-internal)
#   POSTGRES_EXPORTER_URI           lot 3 : "<hôte>:<port>/<base>?sslmode=require" (sans identifiants)
#   POSTGRES_EXPORTER_USER_FILE     lot 3 : fichier privé contenant l'utilisateur PostgreSQL (lecture seule de préférence)
#   POSTGRES_EXPORTER_PASS_FILE     lot 3 : fichier privé contenant son mot de passe
#   OPS_TEXTFILE_DIR                lot 3 : répertoire des métriques des crons (défaut /var/lib/node_exporter/textfile)
#   MONITORING_GRAFANA_PASSWORD_FILE  lot hygiène (2026-11) : fichier privé du mot de passe admin Grafana (lisible par
#                                   l'uid 472 de l'image), créé par setup-monitoring.sh depuis GRAFANA_PASSWORD de backend/.env
#
# Lot 3 (audit 2026-11-02 infra P1-4) : node-exporter et postgres-exporter sont désormais DÉMARRÉS (les règles
# DiskSpaceLow / HighMemory / PostgreSQLDown étaient mortes faute de cible) ; les crons d'exploitation
# (sauvegarde, health check, certificats) publient leurs métriques via le collecteur textfile du node-exporter.
#
# Validation avant démarrage :
#   docker compose -f monitoring/docker-compose.monitoring.yml --env-file <privé> config
#   docker compose -f monitoring/docker-compose.monitoring.yml --env-file <privé> run --rm --no-deps \
#     prometheus promtool check config /etc/prometheus/prometheus.yml
#
# CA privée pour le relais SMTP : ajouter un fichier d'override avec
#   services.alertmanager.volumes: ["${ALERT_SMTP_CA_FILE}:${ALERT_SMTP_CA_FILE}:ro"].

services:

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: cplus-prometheus
    restart: unless-stopped
    # L'image s'exécute sous nobody (65534) : le fichier secret doit être lisible par cet uid
    # (propriétaire 65534 mode 0400, ou groupe 65534 mode 0440), jamais lisible par tous.
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${MONITORING_METRICS_TOKEN_FILE:?MONITORING_METRICS_TOKEN_FILE requis}:/etc/prometheus/secrets/metrics_token:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - cplus-internal

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: cplus-alertmanager
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    volumes:
      - ${ALERTMANAGER_CONFIG_FILE:?ALERTMANAGER_CONFIG_FILE requis}:/etc/alertmanager/alertmanager.yml:ro
      # Mêmes chemins absolus que dans la configuration générée.
      - ${ALERT_SMTP_PASSWORD_FILE:?ALERT_SMTP_PASSWORD_FILE requis}:${ALERT_SMTP_PASSWORD_FILE}:ro
      - ${MONITORING_TEMPLATE_DIR:?MONITORING_TEMPLATE_DIR requis}/alerts.tmpl:${MONITORING_TEMPLATE_DIR}/alerts.tmpl:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - cplus-internal

  # Lot hygiène (2026-11) : Grafana, local seulement (127.0.0.1:3007, tunnel SSH), provisionné (source Prometheus,
  # tableau monitoring/grafana/dashboards/cpay-caisse-api.json), inscription fermée, pas de télémétrie.
  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: cplus-grafana
    restart: unless-stopped
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://127.0.0.1:3007/
      GF_SECURITY_COOKIE_SECURE: "false"
    volumes:
      - ${MONITORING_GRAFANA_PASSWORD_FILE:?MONITORING_GRAFANA_PASSWORD_FILE requis}:/run/secrets/grafana_admin_password:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3007:3000"
    depends_on:
      - prometheus
    networks:
      - cplus-internal

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: cplus-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
      - --collector.disable-defaults
      - --collector.cpu
      - --collector.meminfo
      - --collector.filesystem
      - --collector.loadavg
      - --collector.netdev
      - --collector.textfile
      - --collector.uname
      - --collector.time
    volumes:
      - /:/host:ro,rslave
      - ${OPS_TEXTFILE_DIR:-/var/lib/node_exporter/textfile}:/textfile:ro
    expose:
      - "9100"
    networks:
      - cplus-internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: cplus-postgres-exporter
    restart: unless-stopped
    user: "65534:65534"
    environment:
      DATA_SOURCE_URI: ${POSTGRES_EXPORTER_URI:?POSTGRES_EXPORTER_URI requis}
      DATA_SOURCE_USER_FILE: /run/secrets/pg_user
      DATA_SOURCE_PASS_FILE: /run/secrets/pg_pass
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "true"
    volumes:
      - ${POSTGRES_EXPORTER_USER_FILE:?POSTGRES_EXPORTER_USER_FILE requis}:/run/secrets/pg_user:ro
      - ${POSTGRES_EXPORTER_PASS_FILE:?POSTGRES_EXPORTER_PASS_FILE requis}:/run/secrets/pg_pass:ro
    expose:
      - "9187"
    networks:
      - cplus-internal

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:

networks:
  cplus-internal:
    external: true
    name: ${CPLUS_NETWORK:-docker_cplus-internal}
