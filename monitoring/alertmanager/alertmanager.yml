global:
  resolve_timeout: 5m

route:
  receiver: default-webhook
  group_by: ['alertname', 'service', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default-webhook
    webhook_configs:
      - url: http://api:3000/internal/alerts/prometheus
        send_resolved: true
